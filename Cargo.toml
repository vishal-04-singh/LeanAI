[workspace]
resolver = "2"
members = ["crates/leanai-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["LeanAI Desktop contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ignore = "0.4"
globset = "0.4"
regex = "1"
tiktoken-rs = "0.7"
once_cell = "1"
